name: codex-review

on:
  pull_request_target:
    branches: [staging, master]
    types: [opened, reopened, synchronize]
  pull_request_review:
    branches: [staging]
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  codex-review:
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'staging') ||
      github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the exact-head Codex review status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_REVIEWED_SHA: ${{ github.event.review.commit_id }}
          EVENT_REVIEW_ID: ${{ github.event.review.id }}
          CODEX_LOGIN: chatgpt-codex-connector[bot]
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=pending \
              -f context=codex-review \
              -f description='Waiting for Codex review of this commit'

            # A review can arrive before this workflow run starts. Reconcile it
            # after writing pending so pending can never be the final state.
            REVIEW_ID=$(gh api \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --paginate --slurp | jq -r \
              --arg codex_login "$CODEX_LOGIN" --arg head_sha "$HEAD_SHA" \
              '[.[][] | select(.user.login == $codex_login and .commit_id == $head_sha)] | last | .id // empty')
            if [ -z "$REVIEW_ID" ]; then
              exit 0
            fi
          else
            if [ "$EVENT_REVIEWED_SHA" != "$HEAD_SHA" ]; then
              echo "ignoring Codex review of stale commit ${EVENT_REVIEWED_SHA}"
              exit 0
            fi
            REVIEW_ID="$EVENT_REVIEW_ID"
          fi

          finding_count=$(gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" \
            --paginate --slurp | jq --argjson review_id "$REVIEW_ID" \
            '[.[][] | select(.pull_request_review_id == $review_id)] | length')

          if [ "$finding_count" -eq 0 ]; then
            gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=success \
              -f context=codex-review \
              -f description='Codex review is clean for this commit'
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context=codex-review \
            -f description="Codex review has ${finding_count} finding(s)"
          exit 1

  promotion-source:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected staging branch as the promotion source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [ "$HEAD_BRANCH" = "staging" ]; then
            state=success
            description='Promotion source is the protected staging branch'
          else
            state=failure
            description='Master accepts promotion PRs only from this repository staging branch'
          fi

          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=promotion-source \
            -f description="$description"

          if [ "$state" = "failure" ]; then
            exit 1
          fi

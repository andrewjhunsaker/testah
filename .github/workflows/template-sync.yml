name: template-sync
# Keeps the shareable `template` branch current: whenever framework (non-
# project) paths change on master, they are checked out onto template.
# Project-data paths (targets.yaml, page-maps/, requirements/, tests/specs,
# tests/pages, tickets/, triage/, critiques/, reviews/, flake history,
# docs/coverage, docs/plans, review packets) are NEVER synced.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only meaningful in the upstream testah repo. Projects created FROM the
    # template inherit this file; the guard makes it a no-op there instead of
    # a red run against a template branch they don't have.
    if: github.repository == 'andrewjhunsaker/testah'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: template
          fetch-depth: 0
      - name: Sync framework paths from master
        run: |
          git config user.name "testah-template-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout origin/master -- \
            agents scripts .github .claude CLAUDE.md .mcp.json package.json \
            pnpm-lock.yaml pyproject.toml uv.lock RULES.md README.md \
            docs/spec.md docs/running-the-loop.md
          if git diff --cached --quiet; then
            echo "no framework changes to sync"
            exit 0
          fi
          git commit -m "sync framework from master (${GITHUB_SHA::8})"
          git push origin HEAD:template

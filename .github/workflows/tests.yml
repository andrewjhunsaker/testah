name: tests
on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # no version key — reads "packageManager": "pnpm@10.0.0" from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: availability
        shell: bash
        run: |
          if [ -f dashboard.playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.pull_request.base.sha }}:dashboard.playwright.config.ts" 2>/dev/null; then
            echo "dashboard config was removed from this staging PR" >&2
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.availability.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.availability.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        if: steps.availability.outputs.present == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.availability.outputs.present == 'true'
      - run: uv sync --group dev
        if: steps.availability.outputs.present == 'true'
      - run: pnpm exec playwright install chromium --with-deps
        if: steps.availability.outputs.present == 'true'
      - run: pnpm dashboard:typecheck
        if: steps.availability.outputs.present == 'true'
      - run: pnpm test:dashboard
        if: steps.availability.outputs.present == 'true'

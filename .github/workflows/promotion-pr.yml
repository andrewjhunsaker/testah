name: promotion-pr

on:
  push:
    branches: [staging]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  keep-draft-current:
    name: keep-draft-current
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh the bot-authored draft promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGING_SHA: ${{ github.sha }}
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          open_prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&head=${OWNER}:staging")
          existing=$(jq -r \
            '([.[] | select(.user.login == "github-actions[bot]")][0] // empty) | [.number, .draft] | @tsv' \
            <<< "$open_prs")
          if [ -n "$existing" ]; then
            read -r number is_draft <<< "$existing"
            if [ "$is_draft" = "false" ]; then
              if [ "$PROMOTION_RUN_ATTEMPT" -gt 1 ]; then
                gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
                if ! first_attempt=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}/attempts/1" \
                  --jq '[.conclusion, .head_sha] | @tsv'); then
                  echo "unsafe workflow rerun returned promotion PR #$number to draft: attempt 1 could not be verified" >&2
                  exit 1
                fi
                IFS=$'\t' read -r first_attempt_conclusion first_attempt_head_sha <<< "$first_attempt"
                if [ "$first_attempt_conclusion" != "success" ] \
                  || [ "$first_attempt_head_sha" != "$STAGING_SHA" ]; then
                  echo "unsafe workflow rerun returned promotion PR #$number to draft: attempt 1 did not validate this staging SHA" >&2
                  exit 1
                fi
                current_pr_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .head.sha)
                if [ "$current_pr_head" != "$STAGING_SHA" ]; then
                  echo "unsafe workflow rerun returned promotion PR #$number to draft: promotion PR head no longer matches this staging run" >&2
                  exit 1
                fi
                gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
                echo "validating ready promotion PR #$number on workflow rerun"
              else
                gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
                echo "returned promotion PR #$number to draft for the new staging head"
              fi
            else
              echo "draft promotion PR #$number already tracks staging"
            fi
          else
            conflicting=$(jq -r \
              '([.[] | select(.user.login != "github-actions[bot]")][0] // empty) | .number // empty' \
              <<< "$open_prs")
            if [ -n "$conflicting" ]; then
              echo "non-bot staging promotion PR #$conflicting must be closed before automation can continue" >&2
              exit 1
            fi
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head staging --draft \
              --title "Promote staging to master" \
              --body "Bot-authored promotion PR. An agent may mark it ready after local validation; a human must approve and merge it. CI and Codex review already ran on the staging PRs.")
            number=${pr_url##*/}
          fi

          merge_sha=
          for _ in {1..12}; do
            pr_state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.head.sha, (.merge_commit_sha // "")] | @tsv')
            IFS=$'\t' read -r pr_head_sha merge_sha <<< "$pr_state"
            if [ "$pr_head_sha" = "$STAGING_SHA" ] && [ -n "$merge_sha" ]; then
              break
            fi
            merge_sha=
            sleep 5
          done

          if [ -z "$merge_sha" ]; then
            echo "could not resolve the current test-merge commit for promotion PR #$number" >&2
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=promotion-source \
            -f head_sha="$merge_sha" \
            -f status=completed \
            -f conclusion=success

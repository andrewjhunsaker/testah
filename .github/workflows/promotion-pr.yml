name: promotion-pr

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  keep-draft-current:
    runs-on: ubuntu-latest
    steps:
      - name: Open a bot-authored draft promotion PR when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head staging --state open --json number,isDraft --jq '(.[0] // empty) | [.number, .isDraft] | @tsv')
          if [ -n "$existing" ]; then
            read -r number is_draft <<< "$existing"
            if [ "$is_draft" = "false" ]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
              echo "returned promotion PR #$number to draft for the new staging head"
            else
              echo "draft promotion PR #$number already tracks staging"
            fi
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head staging --draft \
            --title "Promote staging to master" \
            --body "Bot-authored promotion PR. An agent may mark it ready after local validation; a human must approve and merge it. CI and Codex review already ran on the staging PRs."

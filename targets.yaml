# Human-owned. Agents never crawl or test beyond what is designated here.
# Replace the example target with your app. One entry per target; testah is
# project-agnostic and can maintain several targets side by side.
targets:
  example:
    name: Example (replace me)
    base_url: https://example.com
    ticketing: draft # draft | direct — draft requires human approval per ticket
    # bug_destination: (reserved) route product bugs to another tracker later;
    #   unset = testah's own Linear project
    roles: [] # e.g. [admin, member] — a page's `auth:` value is the role key
    pages:
      - slug: home
        path: /
        auth: none

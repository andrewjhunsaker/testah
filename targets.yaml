# Human-owned. Agents never crawl or test beyond what is designated here.
targets:
  vizaeo:
    name: Vizaeo (staging)
    base_url: https://staging.vizaeo.com
    ticketing: draft # draft | direct — draft requires human approval per ticket
    # bug_destination: (reserved) route product bugs to another tracker later;
    #   unset = testah's own Linear project
    roles: [] # e.g. [admin, member] — populate when auth flows are mapped
    pages:
      - slug: help
        path: /help
        auth: none
      - slug: pricing
        path: /pricing
        auth: none
      # / (home) is Clerk-gated on staging (307 → /login); add it back with a
      # role once auth flows are mapped
